    <div id="nymind-boot" aria-label="Načítá se Nymind Cinema">
      <svg class="boot-mark" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="3" y="3" width="74" height="74" rx="18" fill="#151519" stroke="#e50914" stroke-width="3"/><path d="M23 54V25L42 47V25" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M51 27L65 40L51 53Z" fill="#e50914"/></svg>

    <script>
    (function(){
      var boot=document.getElementById('nymind-boot'),count=0,stopped=false;
      function done(){if(stopped)return;stopped=true;if(boot&&boot.parentNode)boot.parentNode.removeChild(boot);}
      function check(){
        if(stopped)return;
        var home=document.getElementById('screen-home');
        var hasContent=home&&home.children&&home.children.length>1;
        if(hasContent){setTimeout(done,450);return;}
        if(++count<70)setTimeout(check,100);else done();
      }
      setTimeout(check,100);
      window.addEventListener('keydown',function(){if(count>20)done();},false);
    })();
